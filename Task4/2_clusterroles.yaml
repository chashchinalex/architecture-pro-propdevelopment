apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "extensions", "networking.k8s.io"]
    resources: ["pods","pods/log","deployments","statefulsets","daemonsets","replicasets","jobs","cronjobs","services","endpoints","ingresses","configmaps","secrets","events","horizontalpodautoscalers","namespaces"]
    verbs: ["get","list","watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: configurator
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "extensions", "networking.k8s.io"]
    resources: ["pods","pods/log","deployments","statefulsets","daemonsets","replicasets","jobs","cronjobs","services","endpoints","ingresses","configmaps","events","horizontalpodautoscalers"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch"]   # только просмотр секретов
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: secrets-privileged
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get","list","watch","create","update","patch","delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get","list","watch","create","update","patch","delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ns-admin
rules:
  - apiGroups: ["", "apps", "batch", "autoscaling", "extensions", "networking.k8s.io","rbac.authorization.k8s.io"]
    resources: ["*"]
    verbs: ["*"]
